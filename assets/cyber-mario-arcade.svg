<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Dark Cyberpunk Arcade Gradient -->
    <linearGradient id="cyber-arcade-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="40%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#140628"/>
    </linearGradient>

    <!-- Neon Glow Gradients -->
    <linearGradient id="neon-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="gold-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Keyframe Animations -->
    <style>
      @keyframes marioRunJump {
        0% { transform: translateX(40px) translateY(0px); }
        35% { transform: translateX(380px) translateY(0px); }
        42% { transform: translateX(440px) translateY(-50px); } /* Jump hitting block */
        50% { transform: translateX(500px) translateY(0px); }
        85% { transform: translateX(920px) translateY(0px); }
        90% { transform: translateX(960px) translateY(-60px); } /* Jump on flagpole */
        100% { transform: translateX(1040px) translateY(0px); }
      }

      @keyframes coinBounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
      }

      @keyframes blockHit {
        0%, 40%, 46%, 100% { transform: translateY(0); }
        43% { transform: translateY(-10px); }
      }

      @keyframes starPulse {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.15); }
      }

      .mario-runner { animation: marioRunJump 6.5s linear infinite; }
      .coin-anim { animation: coinBounce 1.2s ease-in-out infinite; }
      .block-anim { animation: blockHit 6.5s ease infinite; }
      .star-anim { animation: starPulse 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Arcade Main Background -->
  <rect width="1200" height="360" rx="20" fill="url(#cyber-arcade-bg)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="2"/>

  <!-- Cyber Grid Lines -->
  <g opacity="0.08" stroke="#a855f7" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1050" y1="0" x2="1050" y2="360"/>
  </g>

  <!-- Glowing Ambient Lights -->
  <circle cx="200" cy="80" r="140" fill="#d946ef" opacity="0.1" filter="url(#neon-glow)"/>
  <circle cx="1000" cy="280" r="160" fill="#06b6d4" opacity="0.1" filter="url(#neon-glow)"/>

  <!-- TOP HUD BAR -->
  <g transform="translate(50, 40)">
    <!-- Player Stats -->
    <text x="0" y="0" font-family="'Fira Code', monospace" font-size="14" font-weight="700" fill="#d946ef">MARIO ★ JISHNU G L</text>
    <text x="0" y="22" font-family="'Fira Code', monospace" font-size="18" font-weight="800" fill="#ffffff">00994674488</text>

    <!-- World Level -->
    <text x="500" y="0" font-family="'Fira Code', monospace" font-size="14" font-weight="700" fill="#06b6d4">WORLD</text>
    <text x="510" y="22" font-family="'Fira Code', monospace" font-size="18" font-weight="800" fill="#38bdf8">1-1</text>

    <!-- Lives & Coins -->
    <text x="950" y="0" font-family="'Fira Code', monospace" font-size="14" font-weight="700" fill="#fbbf24">TIME / LIVES</text>
    <text x="960" y="22" font-family="'Fira Code', monospace" font-size="18" font-weight="800" fill="#f59e0b">🔴 x 99</text>
  </g>

  <line x1="50" y1="80" x2="1150" y2="80" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- HERO TITLE INSIDE ARCADE -->
  <g transform="translate(50, 130)">
    <text x="0" y="0" font-family="'Outfit', sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-1">JISHNU G L</text>
    <text x="0" y="32" font-family="'Fira Code', monospace" font-size="16" font-weight="700" fill="url(#neon-cyan)">HubSpot Developer &amp; SaaS Architect · Business Analyst</text>
  </g>

  <!-- FLOATING QUESTION BLOCKS & BRICKS -->
  <g transform="translate(430, 160)" class="block-anim">
    <!-- Brick 1 -->
    <rect x="-40" y="0" width="36" height="36" fill="#b45309" stroke="#f59e0b" stroke-width="2" rx="4"/>
    
    <!-- Question Block 1 (Glowing) -->
    <rect x="5" y="0" width="36" height="36" fill="#f59e0b" stroke="#fef08a" stroke-width="2" rx="4" filter="url(#soft-glow)"/>
    <text x="17" y="25" font-family="'Fira Code', monospace" font-size="20" font-weight="900" fill="#ffffff">?</text>
    
    <!-- Brick 2 -->
    <rect x="50" y="0" width="36" height="36" fill="#b45309" stroke="#f59e0b" stroke-width="2" rx="4"/>

    <!-- Question Block 2 -->
    <rect x="95" y="0" width="36" height="36" fill="#f59e0b" stroke="#fef08a" stroke-width="2" rx="4" filter="url(#soft-glow)"/>
    <text x="107" y="25" font-family="'Fira Code', monospace" font-size="20" font-weight="900" fill="#ffffff">?</text>

    <!-- Floating Gold Coin above Question Block -->
    <circle cx="23" cy="-25" r="10" fill="url(#gold-shine)" stroke="#fef08a" stroke-width="2" class="coin-anim"/>
    <text x="19" y="-19" font-family="sans-serif" font-size="12" font-weight="bold" fill="#78350f">$</text>

    <!-- Star Powerup -->
    <path class="star-anim" d="M 113 -35 L 116 -25 L 126 -25 L 118 -19 L 121 -9 L 113 -15 L 105 -9 L 108 -19 L 100 -25 L 110 -25 Z" fill="#facc15"/>
  </g>

  <!-- GROUND PLATFORM (BRICK & NEON PIPE) -->
  <g transform="translate(0, 290)">
    <!-- Neon Ground -->
    <rect x="0" y="0" width="1200" height="70" fill="#0f172a"/>
    <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#neon-purple)" stroke-width="4" filter="url(#soft-glow)"/>
    
    <!-- Brick tiles grid -->
    <path d="M 0 20 L 1200 20 M 0 40 L 1200 40 M 60 0 L 60 20 M 180 0 L 180 20 M 300 0 L 300 20 M 420 0 L 420 20 M 540 0 L 540 20 M 660 0 L 660 20 M 780 0 L 780 20 M 900 0 L 900 20 M 1020 0 L 1020 20 M 1140 0 L 1140 20 M 120 20 L 120 40 M 240 20 L 240 40 M 360 20 L 360 40 M 480 20 L 480 40 M 600 20 L 600 40 M 720 20 L 720 40 M 840 20 L 840 40 M 960 20 L 960 40 M 1080 20 L 1080 40" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

    <!-- Green Warp Pipe -->
    <g transform="translate(760, -70)">
      <rect x="0" y="0" width="60" height="20" rx="3" fill="#10b981" stroke="#34d399" stroke-width="2"/>
      <rect x="5" y="20" width="50" height="50" fill="#059669" stroke="#34d399" stroke-width="2"/>
      <!-- Pipe Shine -->
      <rect x="10" y="2" width="8" height="16" fill="#a7f3d0" opacity="0.6"/>
      <rect x="12" y="22" width="6" height="46" fill="#a7f3d0" opacity="0.6"/>
    </g>

    <!-- Flagpole at Castle Finish Line -->
    <g transform="translate(980, -160)">
      <line x1="0" y1="0" x2="0" y2="160" stroke="#cbd5e1" stroke-width="4"/>
      <circle cx="0" cy="0" r="8" fill="#facc15"/>
      <!-- Flag -->
      <path d="M 0 10 L -40 25 L 0 40 Z" fill="#ef4444"/>
    </g>
  </g>

  <!-- ANIMATED SUPER MARIO SPRITE RUNNER -->
  <g class="mario-runner" transform="translate(0, 245)">
    <!-- Cap -->
    <path d="M 6 0 L 28 0 L 32 8 L 4 8 Z" fill="#ef4444"/>
    <!-- Face -->
    <rect x="8" y="8" width="18" height="14" fill="#fca5a5" rx="2"/>
    <!-- Eyes & Nose -->
    <rect x="20" y="10" width="3" height="5" fill="#000"/>
    <circle cx="24" cy="15" r="3" fill="#fca5a5"/>
    <rect x="14" y="16" width="12" height="4" fill="#451a03" rx="1"/>
    <!-- Overalls & Shirt -->
    <rect x="8" y="22" width="18" height="12" fill="#ef4444"/>
    <rect x="10" y="24" width="4" height="10" fill="#3b82f6"/>
    <rect x="20" y="24" width="4" height="10" fill="#3b82f6"/>
    <circle cx="12" cy="30" r="1.5" fill="#facc15"/>
    <circle cx="22" cy="30" r="1.5" fill="#facc15"/>
    <!-- Running Shoes -->
    <rect x="2" y="34" width="12" height="7" fill="#78350f" rx="2"/>
    <rect x="20" y="34" width="12" height="7" fill="#78350f" rx="2"/>
  </g>

  <!-- ANIMATED LUIGI SPRITE RUNNING BEHIND -->
  <g class="mario-runner" transform="translate(-60, 245)">
    <!-- Green Cap -->
    <path d="M 6 0 L 28 0 L 32 8 L 4 8 Z" fill="#10b981"/>
    <!-- Face -->
    <rect x="8" y="8" width="18" height="14" fill="#fca5a5" rx="2"/>
    <!-- Eyes & Mustache -->
    <rect x="20" y="10" width="3" height="5" fill="#000"/>
    <rect x="14" y="16" width="12" height="4" fill="#451a03" rx="1"/>
    <!-- Green Shirt & Overalls -->
    <rect x="8" y="22" width="18" height="12" fill="#10b981"/>
    <rect x="10" y="24" width="4" height="10" fill="#3b82f6"/>
    <rect x="20" y="24" width="4" height="10" fill="#3b82f6"/>
    <!-- Shoes -->
    <rect x="2" y="34" width="12" height="7" fill="#78350f" rx="2"/>
    <rect x="20" y="34" width="12" height="7" fill="#78350f" rx="2"/>
  </g>
</svg>
