<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 140" width="100%" height="100%">
  <defs>
    <style>
      .brick { fill: #d35400; stroke: #8e44ad; stroke-width: 1; }
      .block { fill: #f39c12; stroke: #d35400; stroke-width: 2; }
      .q-mark { font-family: 'Fira Code', monospace; font-weight: 800; font-size: 16px; fill: #ffffff; }
      
      /* Mario Running Animation */
      @keyframes runMario {
        0% { transform: translateX(-40px); }
        45% { transform: translateX(450px) translateY(0px); }
        50% { transform: translateX(500px) translateY(-35px); } /* Jump on ? block */
        55% { transform: translateX(550px) translateY(0px); }
        100% { transform: translateX(1040px); }
      }

      /* Coin Floating Animation */
      @keyframes spinCoin {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }

      /* Mushroom Float */
      @keyframes floatPowerup {
        0% { transform: translateX(520px) translateY(0px); opacity: 0; }
        50% { transform: translateX(520px) translateY(-30px); opacity: 1; }
        100% { transform: translateX(560px) translateY(0px); opacity: 1; }
      }

      .mario-group {
        animation: runMario 7s linear infinite;
      }
      .coin {
        animation: spinCoin 1.2s ease-in-out infinite;
      }
      .power-mushroom {
        animation: floatPowerup 7s linear infinite;
      }
    </style>
    <linearGradient id="bg-sky" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="1000" height="140" rx="12" fill="url(#bg-sky)" stroke="rgba(255,255,255,0.1)"/>

  <!-- Clouds in background -->
  <g fill="#334155" opacity="0.4">
    <path d="M 120 40 Q 135 25 155 35 Q 175 25 190 40 Q 200 50 180 55 Q 110 55 120 40 Z"/>
    <path d="M 620 30 Q 635 15 655 25 Q 675 15 690 30 Q 700 40 680 45 Q 610 45 620 30 Z"/>
  </g>

  <!-- Ground Brick Platform -->
  <g transform="translate(0, 110)">
    <!-- Base ground tiles -->
    <rect x="0" y="0" width="1000" height="30" fill="#e67e22"/>
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#f39c12" stroke-width="4"/>
    <!-- Brick pattern lines -->
    <path d="M 0 15 L 1000 15 M 50 0 L 50 15 M 150 0 L 150 15 M 250 0 L 250 15 M 350 0 L 350 15 M 450 0 L 450 15 M 550 0 L 550 15 M 650 0 L 650 15 M 750 0 L 750 15 M 850 0 L 850 15 M 950 0 L 950 15 M 100 15 L 100 30 M 200 15 L 200 30 M 300 15 L 300 30 M 400 15 L 400 30 M 500 15 L 500 30 M 600 15 L 600 30 M 700 15 L 700 30 M 800 15 L 800 30 M 900 15 L 900 30" stroke="#d35400" stroke-width="2"/>
  </g>

  <!-- Question Blocks & Bricks Floating -->
  <g transform="translate(480, 50)">
    <!-- Brick Block -->
    <rect x="-40" y="0" width="30" height="30" fill="#d35400" stroke="#e67e22" stroke-width="2" rx="3"/>
    <!-- Question Block 1 -->
    <rect x="0" y="0" width="30" height="30" fill="#f39c12" stroke="#f1c40f" stroke-width="2" rx="3"/>
    <text x="10" y="22" class="q-mark">?</text>
    
    <!-- Brick Block -->
    <rect x="40" y="0" width="30" height="30" fill="#d35400" stroke="#e67e22" stroke-width="2" rx="3"/>
    
    <!-- Question Block 2 -->
    <rect x="80" y="0" width="30" height="30" fill="#f39c12" stroke="#f1c40f" stroke-width="2" rx="3"/>
    <text x="90" y="22" class="q-mark">?</text>

    <!-- Floating Coin above block -->
    <circle cx="15" cy="-20" r="8" fill="#f1c40f" stroke="#f39c12" stroke-width="2" class="coin"/>
    <text x="12" y="-15" font-family="sans-serif" font-size="10" font-weight="bold" fill="#7f8c8d">$</text>
  </g>

  <!-- Super Mushroom Power-Up -->
  <g class="power-mushroom" transform="translate(520, 82)">
    <path d="M 0 10 Q 12 -8 24 10 Z" fill="#e74c3c"/>
    <circle cx="6" cy="4" r="3" fill="#ffffff"/>
    <circle cx="18" cy="4" r="3" fill="#ffffff"/>
    <rect x="5" y="10" width="14" height="10" fill="#f5cd79" rx="2"/>
    <circle cx="8" cy="14" r="1.5" fill="#000"/>
    <circle cx="16" cy="14" r="1.5" fill="#000"/>
  </g>

  <!-- Animated Mario Character Group -->
  <g class="mario-group" transform="translate(0, 75)">
    <!-- Cap & Hair -->
    <path d="M 6 0 L 26 0 L 30 8 L 4 8 Z" fill="#e74c3c"/>
    <!-- Face / Ears -->
    <rect x="8" y="8" width="16" height="12" fill="#ffb8b8" rx="2"/>
    <!-- Eyes & Mustache -->
    <rect x="18" y="10" width="3" height="4" fill="#000"/>
    <rect x="14" y="14" width="10" height="4" fill="#5c4033" rx="1"/>
    <!-- Shirt / Overalls -->
    <rect x="8" y="20" width="16" height="10" fill="#e74c3c"/>
    <rect x="10" y="22" width="4" height="10" fill="#2980b9"/>
    <rect x="18" y="22" width="4" height="10" fill="#2980b9"/>
    <circle cx="12" cy="28" r="1.5" fill="#f1c40f"/>
    <circle cx="20" cy="28" r="1.5" fill="#f1c40f"/>
    <!-- Running Shoes -->
    <rect x="4" y="30" width="10" height="6" fill="#795548" rx="2"/>
    <rect x="18" y="30" width="10" height="6" fill="#795548" rx="2"/>
  </g>

  <!-- Text Overlay: LEVEL 1-1 -->
  <text x="30" y="30" font-family="'Fira Code', monospace" font-size="13" font-weight="bold" fill="#f1c40f">MARIO WORLD 1-1</text>
  <text x="850" y="30" font-family="'Fira Code', monospace" font-size="13" font-weight="bold" fill="#10b981">SCORE ★ 99990</text>
</svg>
