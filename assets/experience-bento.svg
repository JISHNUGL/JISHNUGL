<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="line-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" rx="16" fill="url(#bg-card)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Card Title -->
  <text x="50" y="55" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.5">💼 Enterprise Career &amp; Experience Timeline</text>
  <line x1="50" y1="75" x2="1150" y2="75" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Timeline Line -->
  <line x1="90" y1="120" x2="90" y2="420" stroke="url(#line-glow)" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- Item 1: Connected CRM Studio -->
  <g transform="translate(90, 115)">
    <circle cx="0" cy="0" r="8" fill="#8b5cf6" filter="url(#glow-light)"/>
    <rect x="30" y="-15" width="1030" height="70" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(139, 92, 246, 0.3)"/>
    <text x="50" y="10" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">HubSpot Developer @ Connected CRM Studio</text>
    <text x="850" y="10" fill="#a78bfa" font-family="sans-serif" font-size="13" font-weight="600">Aug 2026 – Present</text>
    <text x="50" y="34" fill="#94a3b8" font-family="sans-serif" font-size="13">Implemented HubSpot CRM, EDM solutions, marketing SEO &amp; automated workflows.</text>
  </g>

  <!-- Item 2: Kambaa Inc -->
  <g transform="translate(90, 205)">
    <circle cx="0" cy="0" r="8" fill="#06b6d4" filter="url(#glow-light)"/>
    <rect x="30" y="-15" width="1030" height="70" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(6, 182, 212, 0.3)"/>
    <text x="50" y="10" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">Business Analyst &amp; SaaS Implementation Specialist @ Kambaa Inc</text>
    <text x="850" y="10" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="600">Feb 2025 – Jul 2026</text>
    <text x="50" y="34" fill="#94a3b8" font-family="sans-serif" font-size="13">Led end-to-end Freshdesk/Freshservice/HubSpot SaaS rollouts for enterprise clients: Ezone &amp; Myntra.</text>
  </g>

  <!-- Item 3: NVIDIA -->
  <g transform="translate(90, 295)">
    <circle cx="0" cy="0" r="8" fill="#76b900" filter="url(#glow-light)"/>
    <rect x="30" y="-15" width="1030" height="70" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(118, 185, 0, 0.3)"/>
    <text x="50" y="10" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">Associate Process Executive @ NVIDIA</text>
    <text x="850" y="10" fill="#a3e635" font-family="sans-serif" font-size="13" font-weight="600">Sep 2024 – Feb 2025</text>
    <text x="50" y="34" fill="#94a3b8" font-family="sans-serif" font-size="13">Autonomous vehicle computer vision video labeling, AI model validation &amp; QA protocol management.</text>
  </g>

  <!-- Item 4: Osai eBiz -->
  <g transform="translate(90, 385)">
    <circle cx="0" cy="0" r="8" fill="#3b82f6" filter="url(#glow-light)"/>
    <rect x="30" y="-15" width="1030" height="70" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(59, 130, 246, 0.3)"/>
    <text x="50" y="10" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">Technical Support Engineer @ Osai eBiz Integrators</text>
    <text x="850" y="10" fill="#60a5fa" font-family="sans-serif" font-size="13" font-weight="600">May 2022 – Sep 2023</text>
    <text x="50" y="34" fill="#94a3b8" font-family="sans-serif" font-size="13">Freshservice ITSM ticket resolution, Freshsales CRM lead tracking, and IT support administration.</text>
  </g>
</svg>
