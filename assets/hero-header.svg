<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="header-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>

    <!-- Gradient Accents -->
    <linearGradient id="purple-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    
    <linearGradient id="green-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Frame -->
  <rect width="1200" height="280" rx="16" fill="url(#header-bg)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>

  <!-- Ambient Light Orbs -->
  <circle cx="100" cy="50" r="100" fill="#8b5cf6" opacity="0.12" filter="url(#soft-glow)"/>
  <circle cx="1100" cy="220" r="120" fill="#06b6d4" opacity="0.12" filter="url(#soft-glow)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.04">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="200" y1="0" x2="200" y2="280"/>
    <line x1="400" y1="0" x2="400" y2="280"/>
    <line x1="600" y1="0" x2="600" y2="280"/>
    <line x1="800" y1="0" x2="800" y2="280"/>
    <line x1="1000" y1="0" x2="1000" y2="280"/>
  </g>

  <!-- Top Status Badge -->
  <g transform="translate(60, 40)">
    <rect width="190" height="32" rx="16" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="1"/>
    <circle cx="20" cy="16" r="4.5" fill="#10b981" filter="url(#soft-glow)"/>
    <text x="34" y="20.5" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">OPEN TO OPPORTUNITIES</text>
  </g>

  <!-- Main Name Title -->
  <text x="60" y="125" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', sans-serif" font-size="46" font-weight="800" letter-spacing="-1">Jishnu G L</text>

  <!-- Headline Subtitle -->
  <text x="60" y="162" fill="url(#purple-cyan)" font-family="'Fira Code', Consolas, monospace" font-size="18" font-weight="600">HubSpot Developer · Business Analyst · ITSM Specialist</text>

  <!-- Key Expertise Summary -->
  <text x="60" y="198" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="400">Specializing in Enterprise SaaS (HubSpot, Freshservice, Freshdesk) for clients like Myntra &amp; Ezone.</text>

  <!-- Feature Pills -->
  <g transform="translate(60, 222)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="150" height="28" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="12" y="18" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">💼 3+ Yrs SaaS Exp</text>

    <!-- Pill 2 -->
    <rect x="160" y="0" width="160" height="28" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="172" y="18" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">🚀 Enterprise Clients</text>

    <!-- Pill 3 -->
    <rect x="330" y="0" width="160" height="28" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="342" y="18" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">🤖 NVIDIA AI Data QA</text>

    <!-- Pill 4 -->
    <rect x="500" y="0" width="140" height="28" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="512" y="18" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">📜 AWS Partner</text>
  </g>

  <!-- Right Decorative Geometric Accent -->
  <g transform="translate(1080, 50)" opacity="0.6">
    <rect width="60" height="60" rx="12" fill="none" stroke="url(#purple-cyan)" stroke-width="2"/>
    <circle cx="30" cy="30" r="16" fill="url(#purple-cyan)" opacity="0.2"/>
  </g>
</svg>
