<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#16161e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="495" height="195" rx="10" fill="url(#card-bg)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Card Title -->
  <text x="30" y="38" fill="#70a5fd" font-family="-apple-system, BlinkMacSystemFont, 'Fira Code', monospace" font-size="18" font-weight="700">Jishnu G L's GitHub Stats</text>

  <!-- Stat Items Grid -->
  <!-- Item 1: Total Stars -->
  <g transform="translate(30, 75)">
    <path d="M 0 0 L 3 6 L 10 7 L 5 12 L 6 19 L 0 15 L -6 19 L -5 12 L -10 7 L -3 6 Z" fill="#bf91f7" transform="translate(10, 0)"/>
    <text x="35" y="5" fill="#a9b1d6" font-family="sans-serif" font-size="14" font-weight="600">Total Stars Earned:</text>
    <text x="210" y="5" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="700">12</text>
  </g>

  <!-- Item 2: Public Repositories -->
  <g transform="translate(30, 105)">
    <path d="M 4 -8 L -4 -8 L -8 -4 L -8 8 L 8 8 L 8 -4 Z" fill="#70a5fd"/>
    <text x="35" y="5" fill="#a9b1d6" font-family="sans-serif" font-size="14" font-weight="600">Public Repositories:</text>
    <text x="210" y="5" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="700">19</text>
  </g>

  <!-- Item 3: Total Contributions -->
  <g transform="translate(30, 135)">
    <circle cx="10" cy="0" r="6" fill="#38bdf8"/>
    <text x="35" y="5" fill="#a9b1d6" font-family="sans-serif" font-size="14" font-weight="600">Total Contributions:</text>
    <text x="210" y="5" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="700">380+</text>
  </g>

  <!-- Item 4: Rank Grade -->
  <g transform="translate(350, 100)">
    <circle cx="40" cy="10" r="36" fill="none" stroke="#70a5fd" stroke-width="4" filter="url(#glow)"/>
    <text x="40" y="20" text-anchor="middle" fill="#70a5fd" font-family="'Fira Code', monospace" font-size="28" font-weight="900">A+</text>
    <text x="40" y="60" text-anchor="middle" fill="#a9b1d6" font-family="sans-serif" font-size="11" font-weight="600">GITHUB RANK</text>
  </g>
</svg>
