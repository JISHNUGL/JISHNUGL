<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    
    <!-- Accent Glow Gradients -->
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    
    <!-- Border Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card Base -->
  <rect width="1200" height="320" rx="20" fill="url(#bg-grad)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <!-- Decorative Ambient Glow Orbs -->
  <circle cx="150" cy="80" r="120" fill="#a855f7" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1050" cy="240" r="140" fill="#06b6d4" opacity="0.12" filter="url(#glow)"/>

  <!-- Grid Pattern overlay -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/>
  </g>

  <!-- Live Status Badge -->
  <g transform="translate(60, 45)">
    <rect width="180" height="34" rx="17" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
    <circle cx="22" cy="17" r="5" fill="#10b981" filter="url(#glow)"/>
    <text x="36" y="22" fill="#10b981" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">OPEN TO ROLES</text>
  </g>

  <!-- Main Title -->
  <text x="60" y="135" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', sans-serif" font-size="48" font-weight="800" letter-spacing="-1">Jishnu G L</text>
  
  <!-- Subtitle / Tagline -->
  <text x="60" y="175" fill="url(#accent-purple)" font-family="Fira Code, monospace" font-size="20" font-weight="600">HubSpot Developer · Business Analyst · ITSM Specialist</text>

  <!-- Description -->
  <text x="60" y="215" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="15" font-weight="400">Architecting Enterprise SaaS Platforms (HubSpot, Freshservice, Freshdesk) for clients like Myntra &amp; Ezone.</text>
  
  <!-- Highlights / Quick Stats Bar -->
  <g transform="translate(60, 250)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="32" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <text x="14" y="20" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">💼 3+ Yrs SaaS Exp</text>

    <!-- Pill 2 -->
    <rect x="175" y="0" width="180" height="32" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <text x="189" y="20" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">🚀 Enterprise Clients</text>

    <!-- Pill 3 -->
    <rect x="370" y="0" width="180" height="32" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <text x="384" y="20" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">🤖 NVIDIA AI Data QA</text>

    <!-- Pill 4 -->
    <rect x="565" y="0" width="160" height="32" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <text x="579" y="20" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">📜 AWS Partner</text>
  </g>

  <!-- Decorative Corner Accent Element -->
  <path d="M 1120 40 L 1160 40 L 1160 80" stroke="url(#accent-cyan)" stroke-width="3" fill="none" opacity="0.6"/>
</svg>
